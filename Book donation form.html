<!DOCTYPE html>
<html></html>
<head>
    <title>Book donation Form</title>
</head>
<body>
  <nav>
    <a href="#Book donation"></a>
    <a href="Book details"></a>
  </nav>
<form>

  <h1>Book donation form</h1>
  <fieldset>
    <legend>Personal infromation</legend><br><br>
    <label>Your name</label><br><br>
    <input type="text"><br><br>
    <label>Donor ID</label><br><br>
    <input type="password"><br><br>
    <label>Donation date</label><br><br>
    <input type="date"><br><br>
 </fieldset>

<h1>Book details</h1>
<fiedset>
    <select id="Book details">
  <option value="">--Book Genre--</option><br>
  <option value="Fiction">Fiction</option><br>
  <option value="Romance">Romance</option><br>
  <option value="Science">Science</option><br>
  <option value="Education">Education</option><br>
</select><br>
    <label>Book candition</label>
    <input type="radio">New<br><br>
    <input type="radio">Good<br><br>
    <input type="radio">Used<br><br>
    <label>Book title or any notes</label>
    <textarea rows="10" cols="100"></textarea>
</fiedset><br><br>
  <fieldset>
    <legend>Drop off day</legend>
    <input type="checkbox">Monday<br><br>
    <input type="checkbox">Tuesday<br><br>
    <input type="checkbox">Wednesday<br><br>
    <input type="checkbox">Thursday<br><br>
    <input type="checkbox">Friday<br><br>
  </fieldset>
  <button>Submit</button><br>
</form>
</body>
</html>
