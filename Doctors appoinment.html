<!DOCTYPE html>
<html>
    <head>
        <title> My doctors appointment.</title>
    </head>
    <body>
        <header>
            <h1>My doctors </h1>
            <nav> <a href="#Details"></a>
                  <a href="#Visit"></a>
                  <a href="#Appointment"></a>
            </nav>
        </header>
        <hr>
        <form>
            <fieldset>
                <legend>Personal details</legend>
                <label>Your name:</label>
                <input type="text"> <br><br>
                <label>Patient Id</label>
                <input type="password"><br><br>
                <label>DOB</label>
                <input type="date"><br>
            </fieldset><br>
            <fieldset>
                <legend>Your visit</legend>
                <label>Choose your Dr.</label><br><br>
                <select>
                    <option>Select your Dr.</option><br><br>
                    <option>Dr.Jadhav</option><br><br>
                    <option>Dr.Singh</option><br><br>
                    <option>Dr.Hegmann</option><br><br>
                </select><br><br>
                <label>Reason for your visit</label><br><br>
                <input type="radio">Fever<br><br>
                <input type="radio">Cold<br><br>
                <input type="radio"> Sore throat,body<br><br>
                <label>ANy notes for the doctor</label><br><br>
                <textarea rows="5" cols="50"> 

                </textarea><br>
            </fieldset><br>
            <fieldset>
                <legend>Your prefered days to visit.</legend>
                <input type="checkbox">Monday<br><br>
                <input type="checkbox">Tuesday<br><br>
                <input type="checkbox">Thursday<br><br>
            </fieldset><br>
            <input type="submit">
        </form>
    </body>
</html>
